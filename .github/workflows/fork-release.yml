name: Fork SideStore Release

on:
  push:
    branches: [fix/anisette-server-client-info]
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          NORMALIZED_VERSION="${MARKETING_VERSION}-anisettefix.${{ github.run_number }}+${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build
        run: python3 scripts/ci/workflow.py build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}
          path: build/logs

      - name: Publish Release
        run: |
          TAG="anisette-fix-${{ github.run_number }}"
          gh release create "$TAG" SideStore.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SideStore ${MARKETING_VERSION}" \
            --notes "Fixes Apple ID sign-in error -80046 by sending each anisette server's own /v3/client_info identity, keeping a per-server adi.pb, only rotating between servers of the same kind, and migrating off On-Device Anisette and legacy servers to a Mac anisette server. Built from ${SHORT_COMMIT}." \
            --latest
